<!doctype html>
<html lang="en" class="antialiased bg-transparent" suppresshydrationwarning>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="referrer" content="no-referrer" />
    <title>Liner</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@100..900&family=Montserrat:wght@100..900&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        /* SF Pro: -apple-system picks Text or Display optical size by font size */
        --font-inter:
          -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro", system-ui,
          sans-serif;
        --font-geist-mono: "Geist Mono", monospace;
        --font-roboto-flex:
          "SF Pro Display", -apple-system, BlinkMacSystemFont, system-ui,
          sans-serif;
        --font-montserrat-family: "Montserrat", sans-serif;
      }
      html.app-window #root:empty {
        background: #e4e4e7;
        border-radius: 12px;
      }
      html.app-window[data-theme="dark"] #root:empty {
        background: #000000;
      }
    </style>
  </head>
  <body class="h-full w-full bg-transparent overflow-hidden p-1">
    <div id="root" class="h-full w-full"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
